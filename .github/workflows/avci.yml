name: avci

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avci
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Avci calistir
        run: python avci.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Durumu kaydet
        run: |
          git config user.name "avci-bot"
          git config user.email "avci-bot@users.noreply.github.com"
          git add avci_state.json
          git diff --cached --quiet && exit 0
          git commit -m "avci durum"
          git pull --rebase
          git push
